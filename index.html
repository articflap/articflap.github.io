<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Articflap Portfolio</title>
    <!-- Menggunakan font Urbanist yang mirip dengan font di gambar (bold, bulat, modern) -->
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #121212; /* Latar belakang gelap seperti di gambar tengah */
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #121212;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top White Section (Persis seperti area putih di atas) */
        .top-section {
            background-color: #FFFFFF;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            padding: 30px 24px 24px 24px;
            color: #000;
            margin-bottom: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #F0F0F0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .greeting-small {
            font-size: 0.85rem;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .name {
            font-size: 1.1rem;
            font-weight: 800;
        }

        /* Ikon menu (Garis tiga bundar) */
        .menu-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #EAEAEA;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .menu-icon {
            width: 20px;
            height: 20px;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            position: relative;
        }
        .menu-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 2px;
            background-color: #000;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        /* Skill Pills (Pengganti icon mood di gambar) */
        .skills-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .skills-container::-webkit-scrollbar {
            display: none;
        }

        .skill-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .skill-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .skill-name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .skill-1 { background-color: #E2F5E9; color: #2E8B57; }
        .skill-2 { background-color: #FFEFE5; color: #E05A2B; }
        .skill-3 { background-color: #E5F0FF; color: #2B74E0; }
        .skill-4 { background-color: #F8E5FF; color: #9A2BE0; }

        /* Grid Layout for Cards (Kartu warna-warni) */
        .cards-grid {
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-gap: 16px;
            margin-bottom: 100px; /* Space untuk bottom nav */
        }

        .card {
            border-radius: 24px;
            padding: 20px;
            color: #000;
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }

        .card-wide {
            grid-column: span 2;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }

        /* Warna pastel persis seperti referensi */
        .card-orange { background-color: #FFC59E; }
        .card-purple { background-color: #D3C1F4; }
        .card-green { background-color: #A5F0A5; }

        /* Fake charts (Batang-batang grafik) */
        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 40px;
            margin-bottom: 16px;
        }
        .bar {
            flex: 1;
            background-color: rgba(0,0,0,0.15);
            border-radius: 4px;
        }
        .bar.active { background-color: rgba(0,0,0,0.4); }

        .card-title {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 1.1rem;
            font-weight: 700;
            opacity: 0.8;
        }

        /* Green Card specifics */
        .green-content {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            background-color: #000;
            color: #FFF;
            text-align: center;
            padding: 14px 0;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            text-decoration: none;
        }
        .action-btn.secondary {
            background-color: rgba(0,0,0,0.1);
            color: #000;
        }

        /* Bottom Nav (Menu bawah) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background-color: #121212;
            display: flex;
            justify-content: space-around;
            padding: 20px 0 calc(20px + env(safe-area-inset-bottom));
            z-index: 10;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            fill: #444; /* Warna redup untuk icon tidak aktif */
            transition: fill 0.2s;
        }

        .nav-icon.active {
            fill: #FFF;
        }
        
        .nav-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-dot {
            width: 4px;
            height: 4px;
            background-color: #FFF;
            border-radius: 50%;
            opacity: 0;
        }
        .nav-btn.active .nav-dot {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- Top Section -->
        <div class="top-section">
            <div class="header">
                <div class="user-info">
                    <div class="avatar">👨‍💻</div>
                    <div>
                        <div class="greeting-small">Welcome back</div>
                        <div class="name">Articflap</div>
                    </div>
                </div>
                <div class="menu-btn">
                    <div class="menu-icon"></div>
                </div>
            </div>

            <div class="main-title">
                Hello Articflap!<br>Here is my portfolio.
            </div>

            <!-- Skill Pills -->
            <div class="skills-container">
                <div class="skill-pill">
                    <div class="skill-icon skill-1">💻</div>
                    <div class="skill-name">Code</div>
                </div>
                <div class="skill-pill">
                    <div class="skill-icon skill-2">🎨</div>
                    <div class="skill-name">Design</div>
                </div>
                <div class="skill-pill">
                    <div class="skill-icon skill-3">🚀</div>
                    <div class="skill-name">Deploy</div>
                </div>
                <div class="skill-pill">
                    <div class="skill-icon skill-4">☕</div>
                    <div class="skill-name">Coffee</div>
                </div>
            </div>
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid">
            
            <!-- Orange Card -->
            <a href="https://github.com/articflap" class="card card-orange">
                <div class="card-header">
                    <span>📦 Projects</span>
                </div>
                <div class="chart-bars">
                    <div class="bar" style="height: 40%"></div>
                    <div class="bar active" style="height: 70%"></div>
                    <div class="bar" style="height: 50%"></div>
                    <div class="bar active" style="height: 90%"></div>
                    <div class="bar" style="height: 60%"></div>
                    <div class="bar" style="height: 80%"></div>
                </div>
                <div class="card-title">15+</div>
                <div class="card-subtitle">Completed</div>
            </a>

            <!-- Purple Card -->
            <div class="card card-purple">
                <div class="card-header">
                    <span>🎯 Focus Level</span>
                </div>
                <div class="chart-bars">
                    <div class="bar" style="height: 30%"></div>
                    <div class="bar" style="height: 50%"></div>
                    <div class="bar" style="height: 40%"></div>
                    <div class="bar" style="height: 70%"></div>
                    <div class="bar active" style="height: 100%"></div>
                </div>
                <div class="card-title">High</div>
                <div class="card-subtitle">Learning AI</div>
            </div>

            <!-- Green Card -->
            <div class="card card-green card-wide">
                <div class="card-header">
                    <span>✨ Let's Connect</span>
                    <span style="margin-left:auto; opacity:0.6;">Available</span>
                </div>
                <div class="green-content">
                    Ready to build something amazing together?
                </div>
                <div class="action-buttons">
                    <a href="mailto:articflap@gmail.com" class="action-btn">Email Me</a>
                    <a href="https://github.com/articflap" class="action-btn secondary">GitHub</a>
                </div>
            </div>

        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <button class="nav-btn active">
                <svg class="nav-icon active" viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9z"/></svg>
                <div class="nav-dot"></div>
            </button>
            <button class="nav-btn">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <div class="nav-dot"></div>
            </button>
            <button class="nav-btn">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                <div class="nav-dot"></div>
            </button>
            <button class="nav-btn">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
                <div class="nav-dot"></div>
            </button>
        </nav>
    </div>
</body>
</html>
