<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Articflap App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-color);
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* Background effects */
        .ambient-light {
            position: absolute;
            top: -10%;
            left: -20%;
            width: 140%;
            height: 40%;
            background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            padding: 24px;
            padding-bottom: 90px;
        }

        /* Header / Profile */
        .profile-header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 32px;
            animation: fadeUp 0.6s ease-out;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 40%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            box-shadow: 0 12px 24px -8px var(--primary-glow);
            border: 2px solid rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }

        .bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
        }

        /* Action Cards */
        .card {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
            animation: fadeUp 0.6s ease-out both;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        .card:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.05);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(59, 130, 246, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            color: var(--primary);
        }

        .card-content h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .card-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 16px 0;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            z-index: 10;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            gap: 6px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="ambient-light"></div>
        
        <div class="content">
            <div class="profile-header">
                <div class="avatar">👨‍💻</div>
                <h1 class="name">Articflap</h1>
                <p class="bio">Developer & Tech Enthusiast</p>
            </div>

            <a href="https://github.com/articflap" class="card">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                </div>
                <div class="card-content">
                    <h3>GitHub Profile</h3>
                    <p>Check out my repositories and projects</p>
                </div>
            </a>

            <a href="mailto:articflap@gmail.com" class="card">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Contact Me</h3>
                    <p>articflap@gmail.com</p>
                </div>
            </a>

            <a href="#" class="card">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                    </svg>
                </div>
                <div class="card-content">
                    <h3>Coming Soon</h3>
                    <p>More features are on the way</p>
                </div>
            </a>
        </div>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M12 3L4 9v12h5v-7h6v7h5V9l-8-6z"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="https://github.com/articflap" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>About</span>
            </a>
        </nav>
    </div>
</body>
</html>
